<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% if refresh %}<meta http-equiv="refresh" content="8">{% endif %}
<title>{{ title }}</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1b1f24;--mut:#5b6672;--acc:#0b7a4b;--bar:#e3e9ef;--warn:#9a6700;--up:#13803f;--dn:#c0392b;--w:#1a7f4b;--r:#6b7280;--p:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#10151a;--card:#182028;--fg:#e8edf2;--mut:#9aa7b4;--acc:#3ecf8e;--bar:#2a3642;--warn:#e3b341;--up:#3ecf8e;--dn:#ff7b72;--w:#1f9d5c;--r:#7b8794;--p:#d9534f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif;padding:12px;max-width:960px;margin-inline:auto}
h1{font-size:20px;margin:6px 0 10px}h2{font-size:16px;margin:14px 0 6px}a{color:var(--acc)}
nav{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:8px}nav a{text-decoration:none;font-weight:600}
.card{background:var(--card);border-radius:12px;padding:12px;margin:10px 0;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:5px 8px;text-align:right;border-bottom:1px solid var(--bar);white-space:nowrap}
th:first-child,td:first-child{text-align:left}.m{color:var(--mut);font-size:13px}select,button{font-size:15px;padding:5px}
.row{display:flex;gap:6px;margin:8px 0}.b{flex:1;text-align:center;border-radius:8px;background:var(--bar);padding:6px 2px;font-size:13px}
.b b{display:block;font-size:16px}.b small{display:block;font-size:10px;font-weight:500;color:var(--mut);line-height:1.2;margin-top:1px}
.b.up1 b,.b.up2 b{color:var(--up)}.b.dn1 b,.b.dn2 b{color:var(--dn)}
.b.up1 small,.b.up2 small{color:var(--up)}.b.dn1 small,.b.dn2 small{color:var(--dn)}
.b.up2{outline:2px solid var(--up)}.b.dn2{outline:2px solid var(--dn)}
.pgrow{margin:5px 0;font-size:12px;display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.pg{display:inline-block;min-width:24px;text-align:center;border-radius:5px;padding:2px 5px;font-size:11px;font-weight:700;color:#fff;cursor:default}
.rv .kpis{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}.kpi{flex:1 1 110px;background:var(--card);border-radius:12px;padding:10px;text-align:center}
.ring{width:74px;height:74px;border-radius:50%;margin:0 auto 4px;display:flex;align-items:center;justify-content:center;position:relative}
.ring span{width:56px;height:56px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px}
.kv{font-size:26px;font-weight:800;line-height:74px}.kv.g{color:var(--up)}.kv.r{color:var(--dn)}.ks{font-size:11px;color:var(--mut)}
.cap{font-size:12px;color:var(--mut);margin:6px 0}.fstrip{display:flex;flex-wrap:wrap;gap:3px}
.fc{width:22px;height:22px;border-radius:5px;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;color:#fff;cursor:default}
.fc.yes{background:var(--w)}.fc.no{background:var(--p)}
.mrow{display:flex;align-items:center;gap:8px;margin:7px 0;flex-wrap:wrap}.ml{flex:0 0 84px;font-size:13px;font-weight:600}
.mt{flex:1 1 140px;height:16px;background:var(--bar);border-radius:8px;position:relative;overflow:hidden;min-width:120px}
.mf{position:absolute;left:0;top:0;bottom:0;background:var(--w);border-radius:8px 0 0 8px}
.mm{position:absolute;top:-2px;bottom:-2px;width:3px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.45);margin-left:-1px}
.bd{position:absolute;top:5px;width:6px;height:6px;border-radius:50%;background:var(--warn);margin-left:-3px}
.mv{flex:0 0 auto;font-size:12px;font-weight:600}.mv small{font-weight:500;color:var(--mut)}.mv small.g{color:var(--up)}.mv small.r{color:var(--dn)}
.rt{overflow-x:auto}.rt table{border-collapse:separate;border-spacing:0 3px;width:100%}.rt th{font-size:11px;color:var(--mut);padding:3px 6px;white-space:nowrap;text-align:center}
.rt td{padding:4px 6px;font-size:12px;text-align:center;white-space:nowrap}.rt td.mt1{text-align:left;font-weight:600}.dt{color:var(--mut);font-weight:500;margin-right:3px}
.rt td.sc{font-weight:700}.rt td.mc{border-radius:6px;font-weight:700}.rt td.mc i{font-style:normal;margin-left:4px;font-size:11px}.rt td.mc small{font-weight:500;opacity:.8}
.rt td.yes,.fc.yes.x{background:rgba(31,157,92,.24);color:var(--up)}.rt td.no{background:rgba(217,83,79,.2);color:var(--dn)}
.rt tr.pr td{padding:0 6px 6px}.pbar{height:6px;border-radius:3px;background:var(--p);overflow:hidden;min-width:44px}.pg1{display:block;height:100%;background:var(--w)}.pn{font-size:10px;color:var(--mut)}
.bk{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}.bet{background:var(--card);border-radius:12px;padding:10px;margin:8px 0}
.bet .hd{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:700}.st{border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;color:#fff}
.st.won{background:var(--w)}.st.lost{background:var(--p)}.st.void,.st.open{background:var(--r)}.bet ul{margin:6px 0;padding-left:18px;font-size:13px}
.bet form{display:inline}.bet button{font-size:12px;padding:3px 8px;margin-right:4px}.pos{color:var(--up)}.neg{color:var(--dn)}
.pg.W{background:var(--w)}.pg.R{background:var(--r)}.pg.P{background:var(--p)}
.hl{outline:2px solid var(--acc)}.pick{color:var(--warn);font-size:13px;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}.t{font-weight:600}
.add{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:3px 9px;cursor:pointer}.add:disabled{opacity:.6}.add.on{background:#6b7280}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.form label{font-size:13px;color:var(--mut)}.form input,.form select{width:100%}.warn{color:var(--warn)}.small{font-size:12px;color:var(--mut);margin-top:16px}.tabs a{margin-right:10px}
</style>
<script>
var FB_KEY='fb_coupon';
function fbLoad(){try{return JSON.parse(localStorage.getItem(FB_KEY))||[];}catch(e){return [];}}
function fbSave(c){try{localStorage.setItem(FB_KEY,JSON.stringify(c));}catch(e){}fbBadge();}
function fbHas(id){return fbLoad().some(function(l){return l.id===id;});}
function fbAdd(id){var c=fbLoad();if(!c.some(function(l){return l.id===id;})){c.push({id:id,odds:''});fbSave(c);return true;}return false;}
function fbRemove(id){var c=fbLoad().filter(function(l){return l.id!==id;});fbSave(c);}
function fbBadge(){var n=fbLoad().length,b=document.getElementById('fb-badge');if(b)b.textContent=n?' ('+n+')':'';}
function fbIds(t){return t.getAttribute('data-ids')?JSON.parse(t.getAttribute('data-ids')):[t.getAttribute('data-id')];}
function fbSync(){document.querySelectorAll('.add[data-id],.add[data-ids]').forEach(function(t){
  if(!t.hasAttribute('data-label'))t.setAttribute('data-label',t.textContent);
  var on=fbIds(t).every(fbHas);t.classList.toggle('on',on);
  t.textContent=on?(t.hasAttribute('data-ids')?'✓ w zestawieniu - kliknij, by odznaczyć':'✓'):t.getAttribute('data-label');
  t.title=on?'Kliknij, aby usunąć z zestawienia':'Kliknij, aby dodać ten typ';});}
document.addEventListener('click',function(e){var t=e.target.closest&&e.target.closest('.add[data-id],.add[data-ids]');if(!t)return;
  var ids=fbIds(t);
  if(ids.every(fbHas))ids.forEach(fbRemove);else ids.forEach(fbAdd);
  fbSync();});
document.addEventListener('DOMContentLoaded',function(){fbBadge();fbSync();});
window.addEventListener('pageshow',function(){fbBadge();fbSync();});
</script>
</head>
<body>
<h1>{{ title }}</h1>
<nav><a href="/?league={{ league }}">Mecze</a><a href="/match?league={{ league }}">Mecz</a><a href="/suggest?league={{ league }}">Podpowiedzi</a><a href="/coupon?league={{ league }}">Zestawienie<span id="fb-badge"></span></a><a href="/draws?league={{ league }}">Remisy</a><a href="/stats?league={{ league }}">Statystyki</a>
<a href="/table?league={{ league }}">Tabela</a><a href="/strengths?league={{ league }}">Siła drużyn</a>
<a href="/recent?league={{ league }}">Ostatnie</a><a href="/track?league={{ league }}">Dziennik</a><a href="/bets?league={{ league }}">Moje zakłady</a><a href="/data?league={{ league }}">Dane</a><a href="/tennis/" title="Tenis">🎾 Tenis</a></nav>
<form method="get" action="{{ request.path }}"><select name="league" onchange="this.form.submit()">
{% for code, lab in leagues %}<option value="{{ code }}" {{ 'selected' if code == league }}>{{ lab }}</option>{% endfor %}
</select></form>
{% block body %}{% endblock %}

</body></html>
