# Deploy na Render. Klucze ustaw w panelu Render (Environment) - NIE w tym pliku.
services:
  - type: web
    name: football-predictor
    runtime: python
    buildCommand: pip install -r requirements.txt && pip install gunicorn
    startCommand: gunicorn fbpred.web:app
    envVars:
      - key: DB_PATH
        value: data/football.db
      - key: DEFAULT_LEAGUE
        value: E0
      - key: API_KEY
        sync: false
