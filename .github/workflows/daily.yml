# Codzienna rutyna ZA DARMO: historia (CSV) + świeże wyniki -> prognozy -> rozliczenie -> Telegram -> zapis do repo.
name: daily

on:
  schedule:
    - cron: "17 6 * * *"      # 06:17 UTC, codziennie
  workflow_dispatch: {}

env:
  LEAGUES: "auto"
  ARCHIVE_ODDS: "1"

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Dane -> prognozy -> rozliczenie
        env:
          FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
        run: |
          python -m fbpred bootstrap --leagues "$LEAGUES" --years 4 --export-ledger
          python -m fbpred report --leagues "$LEAGUES" --out ledger/REPORT.md

      - name: Powiadomienie Telegram (opcjonalne)
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m fbpred notify --leagues "$LEAGUES" --days 3

      - name: Zapisz zmiany w repo
        run: |
          git config user.name "fbpred-bot"
          git config user.email "fbpred-bot@users.noreply.github.com"

          git add ledger history/odds

          if ! git diff --cached --quiet; then
            git commit -m "daily: dziennik i kursy $(date -u +%F)"
            git push
          else
            echo "Brak zmian do zapisania."
          fi