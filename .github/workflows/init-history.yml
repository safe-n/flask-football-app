# Jednorazowo (ręcznie): pobierz historię wielu lig i sezonów do history/*.csv. Bez lokalnego Pythona - klikasz "Run workflow".
name: init-history
on:
  workflow_dispatch:
    inputs:
      leagues:
        description: "Kody lig (football-data.co.uk) + opcjonalnie CL (Liga Mistrzów, wymaga sekretu FOOTBALL_DATA_ORG_TOKEN)"
        default: "E0,D1,SP1,I1,F1,N1,P1,CL"
      seasons:
        description: "Sezony (rok startu), np. 2020-2025"
        default: "2020-2025"
permissions:
  contents: write
concurrency:
  group: repo-write
  cancel-in-progress: false
jobs:
  init:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pobierz historię
        env:
          LEAGUES_IN: ${{ inputs.leagues }}
          SEASONS_IN: ${{ inputs.seasons }}
          FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
        run: |
          python -m fbpred history-init --league "$LEAGUES_IN" --seasons "$SEASONS_IN"
          python -m fbpred history-status
      - name: Zapisz zmiany w repo
        run: |
          git config user.name "fbpred-bot"
          git config user.email "fbpred-bot@users.noreply.github.com"
          git add history
          if git diff --cached --quiet; then
            echo "Brak zmian do zapisania."
          else
            git commit -m "history: inicjalizacja lig $(date -u +%F)"
            for n in 1 2 3; do
              git pull --rebase --autostash && git push && exit 0
              echo "push nieudany, próba $n"; sleep 5
            done
            exit 1
          fi
